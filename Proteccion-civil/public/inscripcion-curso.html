<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscripción a curso | Protección Civil UCOL</title>
  <meta name="description" content="Formulario de inscripción a los cursos de Protección Civil.">
  <meta name="theme-color" content="#144a29">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body data-nav="cursos.html">
  <div id="site-header"></div>

    <section class="page-title">
      <div class="container">
        <h1>Inscripción a curso</h1>
        <p><span id="nombre-curso">Curso</span></p>
      </div>
    </section>
  <main>
    <section class="section">
      <div class="container narrow">
        <div id="aviso"></div>
        <form id="form" class="form-card form" novalidate>
          <div class="form-row">
            <div class="field"><label for="nombre">Nombre completo <span class="req">*</span></label><input type="text" id="nombre" autocomplete="name" required></div>
            <div class="field"><label for="email">Correo electrónico <span class="req">*</span></label><input type="email" id="email" autocomplete="email" required></div>
          </div>
          <div class="form-row form-row-3">
            <div class="field"><label for="telefono">Teléfono <span class="req">*</span></label><input type="tel" id="telefono" autocomplete="tel" required></div>
            <div class="field"><label for="cuenta">Número de cuenta</label><input type="text" id="cuenta" inputmode="numeric"></div>
            <div class="field"><label for="semestre">Semestre</label><input type="number" id="semestre" min="1" max="14"></div>
          </div>
          <div class="field"><label for="carrera">Carrera</label><input type="text" id="carrera"></div>
          <div class="field"><label for="motivacion">Motivación</label><textarea id="motivacion" rows="4"></textarea><p class="hint">Cuéntanos por qué quieres tomar este curso.</p></div>
          <p class="muted" style="font-size:.9rem">Un capacitador revisará tu solicitud y confirmará tu lugar.</p>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="enviar">Confirmar inscripción</button>
            <a class="btn btn-outline" href="cursos.html">Cancelar</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/api.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/pages/inscripcion-curso.js"></script>
</body>
</html>
